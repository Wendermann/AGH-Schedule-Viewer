name: Testy

on:
  push:
    branches-ignore: [main]
  pull_request:
  # Wywoływany też przez pages.yml przed publikacją.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: npm test
