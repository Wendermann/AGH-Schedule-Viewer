services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Cache stron USOS przetrwa restart kontenera.
      - usos-cache:/srv/instance
    environment:
      FLASK_USOS_MIN_INTERVAL: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

volumes:
  usos-cache:
